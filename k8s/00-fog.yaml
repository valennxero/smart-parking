apiVersion: v1
kind: Namespace
metadata: { name: parking }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: mosquitto-conf, namespace: parking }
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence false
    log_dest stdout
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mosquitto, namespace: parking }
spec:
  replicas: 1
  selector: { matchLabels: { app: mosquitto } }
  template:
    metadata: { labels: { app: mosquitto } }
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports: [ { containerPort: 1883 } ]
          volumeMounts: [ { name: conf, mountPath: /mosquitto/config } ]
      volumes: [ { name: conf, configMap: { name: mosquitto-conf } } ]
---
apiVersion: v1
kind: Service
metadata: { name: mosquitto, namespace: parking }
spec:
  selector: { app: mosquitto }
  ports: [ { port: 1883, targetPort: 1883 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fog-aggregator, namespace: parking }
spec:
  replicas: 1
  selector: { matchLabels: { app: fog-aggregator } }
  template:
    metadata: { labels: { app: fog-aggregator } }
    spec:
      containers:
        - name: fog-aggregator
          image: parking-fog:1.0
          imagePullPolicy: Never
          env: [ { name: BROKER_HOST, value: mosquitto } ]
          ports: [ { containerPort: 5000 } ]
---
apiVersion: v1
kind: Service
metadata: { name: fog-aggregator, namespace: parking }
spec:
  type: NodePort
  selector: { app: fog-aggregator }
  ports: [ { port: 5000, targetPort: 5000, nodePort: 30500 } ]
